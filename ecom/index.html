<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>12 Minutes Of Ecom Advice From A $20M Founder</title>
<meta property="og:type" content="video.other">
<meta property="og:title" content="12 Minutes Of Ecom Advice From A $20M Founder">
<meta property="og:description" content="Watch on YouTube">
<meta property="og:image" content="https://i.ytimg.com/vi/skdPZ3jErF8/hqdefault.jpg">
<meta property="og:url" content="https://radekradzilowski.github.io/go/ecom/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="12 Minutes Of Ecom Advice From A $20M Founder">
<meta name="twitter:image" content="https://i.ytimg.com/vi/skdPZ3jErF8/hqdefault.jpg">
<style>
  :root { --bg:#f6f6f6; --card:#fff; --text:#0f0f0f; --muted:#606060; --line:#e5e5e5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f0f0f; --card:#1a1a1a; --text:#f1f1f1; --muted:#aaa; --line:#2a2a2a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:16px; background:var(--bg); color:var(--text);
         font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
          border-radius:16px; overflow:hidden; }
  .thumb { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#000; }
  .body { padding:18px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .channel { color:var(--muted); font-size:14px; margin:0 0 18px; }
  .open { display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
          padding:15px; border-radius:999px; background:#f00; color:#fff; font-weight:700;
          font-size:17px; text-decoration:none; }
  .open svg { width:22px; height:22px; }
  .web { display:block; text-align:center; margin-top:14px; color:var(--muted);
         font-size:14px; }
</style>
</head>
<body>
<main class="card">
  <img class="thumb" src="https://i.ytimg.com/vi/skdPZ3jErF8/hqdefault.jpg" alt="">
  <div class="body">
    <h1>12 Minutes Of Ecom Advice From A $20M Founder</h1>
    <p class="channel">Vllento &amp; Nart | 8-Figure Ecom Founders</p>
    <a class="open" id="open" href="https://www.youtube.com/watch?v=skdPZ3jErF8">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      Open in YouTube
    </a>
    <a class="web" id="web" href="https://www.youtube.com/watch?v=skdPZ3jErF8">Watch in browser instead</a>
  </div>
</main>
<script>
(function () {
  var id = "skdPZ3jErF8";
  var web = "https://www.youtube.com/watch?v=" + id;
  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var app = null;
  if (android) {
    app = "intent://www.youtube.com/watch?v=" + id +
          "#Intent;scheme=https;package=com.google.android.youtube;" +
          "S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
  } else if (ios) {
    app = "youtube://www.youtube.com/watch?v=" + id;
  }
  if (!app) { location.replace(web); return; }
  document.getElementById("open").href = app;
  setTimeout(function () { location.href = app; }, 60);
})();
</script>
</body>
</html>
